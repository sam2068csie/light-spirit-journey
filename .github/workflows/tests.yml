name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 下載 Godot 4.7.2
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝 numpy（終焉之塔的題目產生器要用）
        run: python -m pip install -q numpy
      - name: 跑測試（題庫和產生器一致、載入、題庫、主要畫面）
        run: GODOT=./godot tests/run_tests.sh
      - name: 效能守門（draw calls 預算，用虛擬螢幕真的畫出來）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri >/dev/null
          SHOTS=/tmp/shots xvfb-run -a -s "-screen 0 1280x720x24" env GODOT=./godot tests/run_tests.sh perf
